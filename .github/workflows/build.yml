name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Build exe with PyInstaller
      run: |
        python -m PyInstaller --noconfirm --clean CorporateDroneAIM.spec
        
    - name: Install Inno Setup via winget
      run: |
        winget install --id JRSoftware.InnoSetup --accept-source-agreements --accept-package-agreements
        
    - name: Build installer
      run: |
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CorporateDroneAIM
        path: |
          dist/CorporateDroneAIM.exe
          installer_output/CorporateDroneAIM_Setup.exe
          
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/CorporateDroneAIM.exe
          installer_output/CorporateDroneAIM_Setup.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}